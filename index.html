const fmt=new Intl.DateTimeFormat('en-u-ca-chinese',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
const cache=new Map();
function lunarParts(date){const p=Object.fromEntries(fmt.formatToParts(date).map(x=>[x.type,x.value]));if(!p.relatedYear)throw Error('此瀏覽器不支援農曆，請使用新版 Chrome、Edge 或 Safari。');return {y:+p.relatedYear,m:parseInt(p.month,10),d:+p.day,leap:p.month.includes('bis')};}
function yearDays(y){if(!cache.has(y)){const out=[];for(let t=Date.UTC(y,0,1);t<Date.UTC(y+1,2,1);t+=86400000){const date=new Date(t),l=lunarParts(date);if(l.y===y)out.push({date,l});}cache.set(y,out);}return cache.get(y);}

function readBirth(){const y=inputYear(),m=+$('month').value,d=+$('day').value;if(!$('year').value||y<1901||y>2099)throw Error('請填寫 1901–2099 年的出生日期。');if($('calendar').value==='lunar'){const found=yearDays(y).find(x=>x.l.m===m&&x.l.d===d&&x.l.leap===$('leap').checked);if(!found)throw Error('此農曆日期不存在，請確認月份、日期與閏月。');return found.date;}const date=new Date(Date.UTC(y,m-1,d));if(date.getUTCFullYear()!==y||date.getUTCMonth()!==m-1||date.getUTCDate()!==d)throw Error('出生日期不存在。');return date;}
function updateDays(){const old=+$('day').value||1,y=inputYear(),m=+$('month').value;let n=31;if($('calendar').value==='solar')n=new Date(Date.UTC(y||2000,m,0)).getUTCDate();else if(y>=1901&&y<=2099){const ds=yearDays(y).filter(x=>x.l.m===m&&x.l.leap===$('leap').checked);n=ds.length?ds.at(-1).l.d:30;}else n=30;$('day').replaceChildren(...Array.from({length:n},(_,i)=>new Option((i+1)+' 日',i+1)));$('day').value=Math.min(old,n);}

    function convertChineseNameToWadeGiles(zh) {
      const clean = (zh || '').trim().replace(/\s+/g, '');
      if (!clean) return '';
      if (clean.length === 1) {
        return SURNAME_WADE_GILES[clean[0]] || CHAR_WADE_GILES[clean[0]] || clean[0];
      }
      const surnameChar = clean[0];
      const givenChars = clean.slice(1).split('');
      const surnameEn = SURNAME_WADE_GILES[surnameChar] || CHAR_WADE_GILES[surnameChar] || surnameChar;
      const givenEnArr = givenChars.map(c => CHAR_WADE_GILES[c] || SURNAME_WADE_GILES[c] || 'O');
      return `${surnameEn}, ${givenEnArr.join('-')}`;
    }

    function drawCornerFretwork(ctx, W, H) {
      ctx.save();
      const pad = 42;
      // 外圈細金框
      ctx.strokeStyle = 'rgba(205, 170, 102, 0.55)';
      ctx.lineWidth = 2.2;
      ctx.strokeRect(pad, pad, W - pad * 2, H - pad * 2);

      // 四角中式回紋與雙線延伸
      function drawCornerUnit(cx, cy, sx, sy) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(sx, sy);

        ctx.strokeStyle = 'rgba(212, 177, 106, 0.72)';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'square';

        // 長延伸雙線 (水平與垂直)
        ctx.beginPath();
        ctx.moveTo(0, 14); ctx.lineTo(310, 14);
        ctx.moveTo(14, 0); ctx.lineTo(14, 290);
        ctx.stroke();

        // 角落回字幾何紋
        ctx.strokeRect(14, 14, 48, 48);
        ctx.strokeRect(26, 26, 24, 24);

        // 第二層階梯轉折
        ctx.beginPath();
        ctx.moveTo(62, 26); ctx.lineTo(98, 26); ctx.lineTo(98, 14);
        ctx.moveTo(26, 62); ctx.lineTo(26, 98); ctx.lineTo(14, 98);
        ctx.stroke();

        // 內層細長裝飾線
        ctx.strokeStyle = 'rgba(212, 177, 106, 0.42)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(98, 24); ctx.lineTo(250, 24);
        ctx.moveTo(24, 98); ctx.lineTo(24, 230);
        ctx.stroke();

        ctx.restore();
      }

      drawCornerUnit(pad, pad, 1, 1);
      drawCornerUnit(W - pad, pad, -1, 1);
      drawCornerUnit(pad, H - pad, 1, -1);
      drawCornerUnit(W - pad, H - pad, -1, -1);
      ctx.restore();
    }

    // 繪製工筆金線盛開蓮花（如左圖左側與右側背景）
    function drawDetailedGoldenLotus(ctx, cx, cy, scale, angle, alpha = 0.28) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.rotate(angle);

      ctx.strokeStyle = `rgba(214, 180, 108, ${alpha})`;
      ctx.fillStyle = `rgba(22, 31, 45, 0.45)`;
      ctx.lineWidth = 2.0;

      // 單片蓮花瓣含葉脈
      function drawPetal(rotAngle, len, width, curve) {
        ctx.save();
        ctx.rotate(rotAngle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-width, -len * 0.35, -width * curve, -len * 0.82, 0, -len);
        ctx.bezierCurveTo(width * curve, -len * 0.82, width, -len * 0.35, 0, 0);
        ctx.fill();
        ctx.stroke();

        // 花瓣細膩葉脈紋
        ctx.strokeStyle = `rgba(214, 180, 108, ${alpha * 0.55})`;
        ctx.lineWidth = 1.1;
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(0, -10);
          ctx.quadraticCurveTo(i * (width * 0.32), -len * 0.55, i * (width * 0.14), -len * 0.88);
          ctx.stroke();
        }
        ctx.restore();
      }

      // 後層展開花瓣
      const backAngles = [-1.15, -0.75, -0.38, 0.38, 0.75, 1.15];
      backAngles.forEach(a => drawPetal(a, 185, 48, 0.85));

      // 中層飽滿花瓣
      const midAngles = [-0.88, -0.48, -0.16, 0.16, 0.48, 0.88];
      midAngles.forEach(a => drawPetal(a, 165, 52, 0.9));

      // 蓮蓬與蓮子點綴
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(0, -95, 36, 16, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(214, 180, 108, ${alpha * 0.25})`;
      ctx.fill();
      ctx.stroke();
      for (let sx = -22; sx <= 22; sx += 11) {
        for (let sy = -100; sy <= -90; sy += 8) {
          ctx.beginPath();
          ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.restore();

      // 前層主花瓣
      drawPetal(-0.28, 150, 48, 0.85);
      drawPetal(0.28, 150, 48, 0.85);
      drawPetal(0, 158, 52, 0.92);

      // 蓮莖
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-18, 180, -8, 380);
      ctx.lineWidth = 3.2;
      ctx.strokeStyle = `rgba(214, 180, 108, ${alpha * 0.85})`;
      ctx.stroke();

      ctx.restore();
    }

      ctx.quadraticCurveTo(12, 110, 5, 240);
      ctx.lineWidth = 2.5;
      ctx.stroke();

    // 繪製傳統吉祥捲雲紋（如左圖右上、右下與左下）
    function drawAuspiciousCloud(ctx, cx, cy, scaleX, scaleY, alpha = 0.34) {
      ctx.save();

      // 外層祥雲輪廓
      ctx.beginPath();
      ctx.moveTo(-140, 22);
      ctx.bezierCurveTo(-175, 22, -180, -18, -135, -22);
      ctx.bezierCurveTo(-130, -58, -75, -65, -55, -38);
      ctx.bezierCurveTo(-35, -88, 45, -88, 62, -38);
      ctx.bezierCurveTo(95, -62, 145, -45, 138, -10);
      ctx.bezierCurveTo(182, -10, 182, 26, 132, 26);
      ctx.lineTo(-140, 22);
      ctx.stroke();

      // 雲頭如意螺旋內紋
      ctx.beginPath();
      ctx.moveTo(-95, 5);
      ctx.bezierCurveTo(-118, 5, -122, -22, -95, -25);
      ctx.bezierCurveTo(-75, -26, -72, -6, -88, -4);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-15, -10);
      ctx.bezierCurveTo(-35, -42, 28, -52, 32, -15);
      ctx.bezierCurveTo(34, 4, 8, 8, 4, -6);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(72, 8);
      ctx.bezierCurveTo(105, 8, 112, -20, 86, -24);
      ctx.stroke();

      ctx.restore();
    }

    // 繪製右下角流金波浪山嵐
    function drawBottomGoldWaves(ctx, W, H) {
      ctx.save();
      const grad1 = ctx.createLinearGradient(W * 0.52, H, W, H * 0.78);
      grad1.addColorStop(0, 'rgba(198, 160, 82, 0.0)');
      grad1.addColorStop(0.45, 'rgba(198, 160, 82, 0.16)');
      grad1.addColorStop(1, 'rgba(218, 182, 105, 0.34)');

      ctx.fillStyle = grad1;
      ctx.beginPath();
      ctx.moveTo(W * 0.50, H - 42);
      ctx.bezierCurveTo(W * 0.68, H - 55, W * 0.76, H - 185, W * 0.89, H - 210);
      ctx.bezierCurveTo(W * 0.94, H - 220, W - 42, H - 205, W - 42, H - 190);
      ctx.lineTo(W - 42, H - 42);
      ctx.closePath();
      ctx.fill();

      const grad2 = ctx.createLinearGradient(W * 0.62, H, W, H * 0.86);
      grad2.addColorStop(0, 'rgba(198, 160, 82, 0.0)');
      grad2.addColorStop(0.5, 'rgba(212, 175, 95, 0.22)');
      grad2.addColorStop(1, 'rgba(230, 195, 115, 0.42)');

      ctx.fillStyle = grad2;
      ctx.beginPath();
      ctx.moveTo(W * 0.62, H - 42);
      ctx.bezierCurveTo(W * 0.75, H - 48, W * 0.84, H - 125, W - 42, H - 135);
      ctx.lineTo(W - 42, H - 42);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 繪製左圖同款「內凹圓弧雙層金框」與無變形等比例照片
    function drawInvertedCovePhotoFrame(ctx, centerX, topY, boxW, boxH) {
      const x = centerX - boxW / 2;
      const y = topY;

      function createInvertedCornerPath(rx, ry, rw, rh, r) {
        ctx.beginPath();
        ctx.moveTo(rx + r, ry);
        ctx.lineTo(rx + rw - r, ry);
        ctx.arc(rx + rw, ry, r, Math.PI, Math.PI * 0.5, true);
        ctx.lineTo(rx + rw, ry + rh - r);
        ctx.arc(rx + rw, ry + rh, r, Math.PI * 1.5, Math.PI, true);
        ctx.lineTo(rx + r, ry + rh);
        ctx.arc(rx, ry + rh, r, 0, Math.PI * 1.5, true);
        ctx.lineTo(rx, ry + r);
        ctx.arc(rx, ry, r, Math.PI * 0.5, 0, true);
        ctx.closePath();
      }

      ctx.save();
      // 外框立體陰影
      ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
      ctx.shadowBlur = 28;
      ctx.shadowOffsetY = 10;

      // 外層深底襯板
      createInvertedCornerPath(x - 14, y - 14, boxW + 28, boxH + 28, 26);
      ctx.fillStyle = '#182232';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      // 外層粗金框
      const frameGrad = ctx.createLinearGradient(x, y, x + boxW, y + boxH);
      frameGrad.addColorStop(0, '#f0d79a');
      frameGrad.addColorStop(0.5, '#c59f52');
      frameGrad.addColorStop(1, '#9c7832');

      createInvertedCornerPath(x - 14, y - 14, boxW + 28, boxH + 28, 26);
      ctx.strokeStyle = frameGrad;
      ctx.lineWidth = 4.5;
      ctx.stroke();

      // 內層細金框與雅緻淺灰白襯底
      createInvertedCornerPath(x, y, boxW, boxH, 22);
      ctx.fillStyle = '#e5e9ec';
      ctx.fill();

      // 裁切照片區域並以真實幾何比例繪製（100% 不壓縮變形）
      ctx.save();
      createInvertedCornerPath(x + 4, y + 4, boxW - 8, boxH - 8, 20);
      ctx.clip();

      const activeImg = uploadedPhotoImg;
      if (activeImg && activeImg.width > 0 && activeImg.height > 0) {
        const zoom = (parseInt(document.getElementById('photoZoom').value, 10) || 100) / 100;
        const panX = parseInt(document.getElementById('photoPanX').value, 10) || 0;
        const panY = parseInt(document.getElementById('photoPanY').value, 10) || 0;

        const imgAspect = activeImg.width / activeImg.height;
        const boxAspect = boxW / boxH;

        let drawW, drawH;
        if (imgAspect > boxAspect) {
          drawH = boxH;
          drawW = boxH * imgAspect;
        } else {
          drawW = boxW;
          drawH = boxW / imgAspect;
        }

        drawW *= zoom;
        drawH *= zoom;

        const drawX = x + (boxW - drawW) / 2 + (panX / 100 * Math.max(0, (drawW-boxW)/2));
        const drawY = y + (boxH - drawH) / 2 + (panY / 100 * Math.max(0, (drawH-boxH)/2));

        ctx.drawImage(activeImg, drawX, drawY, drawW, drawH);
      }
      ctx.restore();

      // 再疊一層內框金線確保邊緣俐落
      createInvertedCornerPath(x, y, boxW, boxH, 22);
      ctx.strokeStyle = frameGrad;
      ctx.lineWidth = 2.6;
      ctx.stroke();

      ctx.restore();
    }

    // 繪製底部八輻法輪與雙側金蓮（如左圖正下方）
    function drawBottomDharmaWheelAndLotuses(ctx, cx, cy) {
      ctx.save();
      ctx.translate(cx, cy);
      const gold = 'rgba(208, 172, 98, 0.78)';
      ctx.strokeStyle = gold;
      ctx.fillStyle = gold;

      // 中央八輻法輪
      ctx.save();
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(0, 0, 38, 0, Math.PI * 2);
      ctx.stroke();

      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 0, 31, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < 8; i++) {
        ctx.save();
        ctx.rotate((Math.PI * 2 * i) / 8);
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(0, 9);
        ctx.lineTo(0, 31);
        ctx.stroke();

        // 外輪緣法釘裝飾
        ctx.beginPath();
        ctx.arc(0, 41, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();

      // 左右對稱小金蓮
      function drawSmallLotusIcon(offsetX) {
        ctx.save();
        ctx.translate(offsetX, 8);
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = 'rgba(208, 172, 98, 0.62)';

        const angles = [-0.85, -0.45, 0, 0.45, 0.85];
        angles.forEach(a => {
          ctx.save();
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-11, -12, -9, -30, 0, -38);
          ctx.bezierCurveTo(9, -30, 11, -12, 0, 0);
          ctx.stroke();
          ctx.restore();
        });
        ctx.restore();
      }

      drawSmallLotusIcon(-115);
      drawSmallLotusIcon(115);

      ctx.restore();
    }

function lines(ctx,text,width){const result=[];for(const para of text.split('\n')){let s='';for(const token of (para.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*|\s+|[^\s]/gu)||[])){if(ctx.measureText(s+token).width>width&&s){result.push(s.trim());s='';}if(ctx.measureText(token).width>width){for(const c of Array.from(token)){if(ctx.measureText(s+c).width>width&&s){result.push(s);s='';}s+=c;}}else{s+=(!s?token.trimStart():token);}}result.push(s);}return result;}
